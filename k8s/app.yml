apiVersion: apps/v1
kind: Deployment
metadata:
  name: meterline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: meterline
  template:
    metadata:
      labels:
        app: meterline
    spec:
      containers:
        - name: meterline
          image: meterline:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://meterline-postgres:5432/meterline
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: meterline-postgres
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: meterline-postgres
                  key: POSTGRES_PASSWORD
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: meterline-kafka:9092
            - name: METERLINE_KAFKA_ENABLED
              value: "true"
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: meterline
spec:
  type: NodePort
  selector:
    app: meterline
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
