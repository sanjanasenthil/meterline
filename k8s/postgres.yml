apiVersion: v1
kind: Secret
metadata:
  name: meterline-postgres
type: Opaque
stringData:
  POSTGRES_DB: meterline
  POSTGRES_USER: meterline
  POSTGRES_PASSWORD: meterline
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: meterline-postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: meterline-postgres
  template:
    metadata:
      labels:
        app: meterline-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: meterline-postgres
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "meterline", "-d", "meterline"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: meterline-postgres
spec:
  selector:
    app: meterline-postgres
  ports:
    - port: 5432
      targetPort: 5432
