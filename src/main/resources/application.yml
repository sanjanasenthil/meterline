spring:
  application:
    name: meterline
  datasource:
    url: jdbc:postgresql://localhost:5432/meterline
    username: meterline
    password: meterline
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: meterline-usage-ingestion
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.meterline.events
        spring.json.value.default.type: com.meterline.events.UsageEventRequest

server:
  port: 8080

meterline:
  kafka:
    enabled: false
    topic: usage-events
